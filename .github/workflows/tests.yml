name: Tests
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 20
      - name: Permit Chromium user namespaces on Ubuntu
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-apparmor.js
          sudo apparmor_parser -r "$RUNNER_TEMP/accesspilot-playwright-userns"
      - run: npm test
        timeout-minutes: 5
      - run: npm audit --audit-level=high
